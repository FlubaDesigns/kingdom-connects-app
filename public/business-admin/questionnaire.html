<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <title>Business Questionnaire - Kingdom Connects Business Admin</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">

  <link rel="stylesheet" href="/styles/layout.css">
  <link rel="stylesheet" href="/styles/theme.css">
  <link rel="stylesheet" href="/styles/buttons.css">
  <link rel="stylesheet" href="/styles/forms.css">
  <link rel="stylesheet" href="/styles/overrides.css">
</head>

<body>
  <a id="top"></a>
  <div class="page-wrap">
  <div id="header"></div>
    <main class="page-content" id="main">
      <div id="breadcrumbs" class="breadcrumb-container"></div>

<h2 class="gold-metallic">Business Questionnaire</h2>
      <p class="text-muted mb-lg">Help us understand your business better. This information helps Kingdom Connects serve you and connect you with the Christian community.</p>
      
      <div id="completionBadge" class="completion-badge hidden">
        ✓ Questionnaire Complete
      </div>

      <div class="progress-text" id="progressText">Loading questions...</div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div id="loadingMessage" class="text-center p-md">Loading questions...</div>
      
      <form id="questionnaireForm" class="hidden">
        <article class="card">
          <h3 class="gold">Business Information</h3>
          <div id="questionsContainer"></div>
          
          <div class="actions mt-lg">
            <button type="button" id="saveDraftBtn" class="btn btn-secondary">Save Draft</button>
            <button type="submit" class="btn btn-gold">Submit Completed Questionnaire</button>
          </div>
        </article>
      </form>
    </section>
  </main>

  <div id="footer"></div>
  </div>

  <script src="js/header.js" defer></script>
  <script src="js/footer.js" defer></script>
  <script src="js/auth-guard.js" defer></script>
  <script src="/js/breadcrumbs.js" defer></script>


  <script type="module" src="js/questionnaire.js"></script>
  <script src="/js/feedback-widget.js" type="module"></script>
</body>
</html>
