<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <title>Sales Team - Kingdom Connects Sales</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/styles/layout.css">
  <link rel="stylesheet" href="/styles/theme.css">
  <link rel="stylesheet" href="/styles/buttons.css">
  <link rel="stylesheet" href="/styles/forms.css">
  <link rel="stylesheet" href="/styles/overrides.css">
  
</head>

<body>
  <a id="top"></a>
  <div class="page-wrap">

  <div id="header"></div>
    <main class="page-content" id="main">
      <div id="breadcrumbs" class="breadcrumb-container"></div>

      <h2 class="gold-metallic text-center">Sales Team Management</h2>
      <p class="text-center text-muted mb-md">View sales agent performance and team hierarchy.</p>

      <div class="split-40-60">
        <div class="split-left">
          <article class="card mb-md">
            <h3 class="gold">Team Features</h3>
            <ul class="text-sm">
              <li><strong>Managers:</strong> View team performance and metrics</li>
              <li><strong>Agents:</strong> Track your own stats</li>
            </ul>
          </article>
        </div>

        <div class="split-right">
          <div id="loading" class="text-center">
            <p>Loading sales team data...</p>
          </div>

          <div id="content" class="hidden">
            <div class="agents-grid" id="agentsList"></div>
          </div>

          <div id="noAccess" class="hidden text-center">
            <p>You do not have sales team access.</p>
          </div>

          <div id="error" class="hidden text-center">
            <p class="text-muted">Unable to load team data.</p>
          </div>
        </div>
      </div>
  </main>

  <div id="footer"></div>

  <script src="js/header.js" defer></script>
  <script src="js/footer.js" defer></script>
  <script src="/js/breadcrumbs.js" defer></script>

  
  </div>
  <script type="module" src="js/agents.js"></script>
  <script src="js/sales-auth-guard.js" defer></script>
  <script src="/js/feedback-widget.js" type="module"></script>
</body>
</html>
