<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <title>Submit a Review - Kingdom Connects</title>
  <meta name="description" content="Leave a review for a business on Kingdom Connects.">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">

  <link rel="stylesheet" href="styles/layout.css?v=7">
  <link rel="stylesheet" href="styles/theme.css?v=7">
  <link rel="stylesheet" href="styles/buttons.css?v=7">
  <link rel="stylesheet" href="styles/forms.css?v=7">
  <link rel="stylesheet" href="styles/overrides.css?v=7">
</head>
<body>
  <a id="top"></a>
  <div class="page-wrap">
    <div id="header"></div>

    <main class="page-content" id="main">
      <div id="breadcrumbs" class="breadcrumb-container"></div>
        <article class="card">
          <h1 class="gold-metallic">Submit a Review</h1>
          <p id="businessNameDisplay" class="review-business-name"></p>
        </article>

        <article class="card">
          <p class="text-sm opacity-70 mb-1"><span class="required">Required fields</span></p>
          <form id="reviewForm" class="form-wrapper">
            <div class="form-group">
              <label for="reviewerName" class="block font-bold required">Your Name</label>
              <input type="text" id="reviewerName" required class="input-dark">
            </div>

            <div class="form-group">
              <label for="starRating" class="block font-bold required">Star Rating</label>
              <select id="starRating" required class="input-dark">
                <option value="">Select Rating</option>
                <option value="5">⭐⭐⭐⭐⭐ (5 Stars - Excellent)</option>
                <option value="4">⭐⭐⭐⭐ (4 Stars - Good)</option>
                <option value="3">⭐⭐⭐ (3 Stars - Average)</option>
                <option value="2">⭐⭐ (2 Stars - Poor)</option>
                <option value="1">⭐ (1 Star - Very Poor)</option>
              </select>
            </div>

            <div class="form-group">
              <label for="reviewText" class="block font-bold required">Your Review</label>
              <textarea id="reviewText" required rows="6" class="textarea-dark"></textarea>
            </div>

            <div id="statusMessage" class="p-md hidden"></div>

            <div class="button-row">
              <button type="submit" class="btn btn-gold">Submit Review</button>
              <a href="business_directory.html" class="btn btn-outline">Cancel</a>
            </div>
          </form>
        </article>
    </main>

    <div id="footer"></div>
  </div>

  <script src="js/maintenance-check.js" type="module"></script>
  <script src="/js/header.js" type="module"></script>
  <script src="js/maintenance-check.js" type="module"></script>
  <script src="/js/footer.js" defer></script>
  <script src="js/maintenance-check.js" type="module"></script>
  <script type="module" src="js/submit-review.js"></script>
  <script src="/js/breadcrumbs.js" defer></script>
</body>
</html>
