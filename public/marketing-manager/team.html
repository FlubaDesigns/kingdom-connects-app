<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <base href="/marketing-manager/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sales Team Management - Kingdom Connects</title>
  
  <link rel="stylesheet" href="/styles/layout.css?v=7">
  <link rel="stylesheet" href="/styles/theme.css?v=7">
  <link rel="stylesheet" href="/styles/buttons.css?v=7">
  <link rel="stylesheet" href="/styles/forms.css?v=7">
  <link rel="stylesheet" href="/styles/overrides.css?v=7">

</head>
<body>
  <div class="page-wrap">
  <div id="header"></div>
    <main class="page-content" id="main">
      <div id="breadcrumbs" class="breadcrumb-container"></div>

    <h2 class="gold-metallic text-center">Sales Team Management</h2>
    <p class="text-center text-muted mb-md">Manage agents, assign leads, and set performance goals.</p>

    <div class="split-40-60">
      <div class="split-40-60-left">
        <a href="sales-applications.html" class="btn btn-gold mb-md">Manage Applications</a>
        <article class="card mb-md">
          <h3 class="gold">Team Stats</h3>
          <div class="stat-grid-2">
            <div class="stat-card">
              <div class="stat-value" id="totalAgentsCount">0</div>
              <div class="stat-label">Total</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="activeAgentsCount">0</div>
              <div class="stat-label">Active</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="teamConversions">0</div>
              <div class="stat-label">Conversions</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="teamRevenue">$0</div>
              <div class="stat-label">Revenue</div>
            </div>
          </div>
        </article>
      </div>

      <div class="split-40-60-right">
        <div class="filter-tabs mb-md">
          <button class="filter-tab active" data-filter="all">All Agents</button>
          <button class="filter-tab" data-filter="active">Active</button>
          <button class="filter-tab" data-filter="top">Top Performers</button>
          <button class="filter-tab" data-filter="needs-attention">Needs Attention</button>
        </div>

        <div id="agentsContainer" class="agent-grid">
          <p class="text-center opacity-60">Loading sales agents...</p>
        </div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <div id="quotaModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="gold-metallic m-0">Set Monthly Quota</h3>
        <button class="modal-close" data-action="closeQuotaModal">&times;</button>
      </div>
      <form id="quotaForm">
        <input type="hidden" id="quotaAgentId">
        <div class="form-field">
          <label class="">Monthly Conversion Goal</label>
          <input type="number" id="quotaValue" class="" min="1" required>
        </div>
        <div class="flex-gap-end">
          <button type="button" class="btn" data-action="closeQuotaModal">Cancel</button>
          <button type="submit" class="btn btn-gold">Save Quota</button>
        </div>
      </form>
    </div>
  </div>

  <div id="assignDirectorModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="gold-metallic m-0">Assign to Sales Director</h3>
        <button class="modal-close" data-action="closeAssignModal">&times;</button>
      </div>
      <form id="assignDirectorForm">
        <input type="hidden" id="assignAgentId">
        <div class="form-field">
          <label>Agent</label>
          <div id="assignAgentName" class="stat-value"></div>
        </div>
        <div class="form-field">
          <label for="directorSelect">Sales Director</label>
          <select id="directorSelect" class="form-select" required>
            <option value="">-- Select Director --</option>
          </select>
          <p class="help-text">Director will receive override commission on this agent's sales</p>
        </div>
        <div class="flex-gap-end">
          <button type="button" class="btn" data-action="closeAssignModal">Cancel</button>
          <button type="submit" class="btn btn-gold">Assign Director</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/header.js" type="module" defer></script>
  <script src="js/footer.js" defer></script>
  <script src="js/team.js" type="module" defer></script>
  <script src="/js/breadcrumbs.js" defer></script>

  <script src="/js/feedback-widget.js" type="module"></script>
</body>
</html>
