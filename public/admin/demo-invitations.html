<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <title>Send Demo - Kingdom Connects Admin</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/styles/layout.css?v=7">
  <link rel="stylesheet" href="/styles/theme.css?v=7">
  <link rel="stylesheet" href="/styles/buttons.css?v=7">
  <link rel="stylesheet" href="/styles/forms.css?v=7">
  <link rel="stylesheet" href="/styles/overrides.css?v=7">
  <style>
    .quick-send-grid { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .quick-send-grid .btn { flex: 1; min-width: 100px; }
    .copy-link-row { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid var(--border); }
    .copy-link-row:last-child { border-bottom: none; }
    .status-message { padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
    .status-message.success { background: rgba(34,197,94,0.1); border: 1px solid #22c55e; color: #22c55e; }
    .status-message.error { background: rgba(239,68,68,0.1); border: 1px solid #ef4444; color: #ef4444; }
    .section-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
    .section-title { color: var(--gold); margin-bottom: 1rem; font-size: 1.1rem; }
  </style>
  <script type="module" src="/admin/js/admin-auth-guard.js"></script>
</head>
<body>
  <div class="page-wrap">
    <div id="header"></div>

    <main class="page-content" id="main">
      <div id="breadcrumbs" class="breadcrumb-container"></div>
      <div id="loadingState" class="text-center mt-lg">
        <p>Loading...</p>
      </div>

      <div id="mainContent" class="hidden max-w-lg mx-auto">
        <h1 class="gold-metallic mb-sm">Send Demo</h1>
        <p class="text-muted mb-lg">Send demo links to investors or potential partners.</p>

        <div id="statusMessage" class="status-message hidden"></div>

        <div class="section-card">
          <h3 class="section-title">Quick Re-Send</h3>
          <div id="quickSendSection"></div>
        </div>

        <div class="section-card">
          <h3 class="section-title">New Recipient</h3>
          <form id="sendForm">
            <div class="form-field">
              <label for="recipientEmail">Email</label>
              <input type="email" id="recipientEmail" class="input-dark" required placeholder="investor@example.com">
            </div>
            <div class="form-field">
              <label for="recipientName">Name (optional)</label>
              <input type="text" id="recipientName" class="input-dark" placeholder="John Smith">
            </div>
            <div class="form-field">
              <label for="demoType">Demo</label>
              <select id="demoType" class="input-dark" required>
                <option value="">Select...</option>
                <option value="hub">All Demos (Hub)</option>
                <option value="member">Member Signup</option>
                <option value="business_free">Free Business</option>
                <option value="business_pro">Pro Business</option>
                <option value="church">Church</option>
                <option value="sales">Sales Agent</option>
              </select>
            </div>
            <div class="form-field">
              <label for="personalNote">Note (optional)</label>
              <textarea id="personalNote" class="input-dark" rows="2" placeholder="Personal message..."></textarea>
            </div>
            <button type="submit" id="sendBtn" class="btn btn-gold full-width">Send</button>
          </form>
        </div>

        <div class="section-card">
          <h3 class="section-title">Try Demo Yourself</h3>
          <div class="quick-send-grid">
            <a href="https://kingdom-commerce.web.app/demo/" target="_blank" class="btn btn-gold">All Demos</a>
            <a href="https://kingdom-commerce.web.app/add_to_directory.html?demo=member" target="_blank" class="btn btn-outline">Member</a>
            <a href="https://kingdom-commerce.web.app/add_to_directory.html?demo=business_free" target="_blank" class="btn btn-outline">Free Biz</a>
            <a href="https://kingdom-commerce.web.app/add_to_directory.html?demo=business_pro" target="_blank" class="btn btn-outline">Pro Biz</a>
            <a href="https://kingdom-commerce.web.app/add_to_directory.html?demo=church" target="_blank" class="btn btn-outline">Church</a>
            <a href="https://kingdom-commerce.web.app/sales/onboarding.html?demo=sales" target="_blank" class="btn btn-outline">Sales</a>
          </div>
        </div>

        <div class="section-card">
          <h3 class="section-title">Copy Links</h3>
          <div id="copyLinksSection"></div>
        </div>

        <div class="section-card">
          <h3 class="section-title">Demo Records Cleanup</h3>
          <p class="text-muted mb-sm">Records created during demo sessions.</p>
          <div class="demo-filter-tabs mb-md" style="display:flex;gap:8px;flex-wrap:wrap;">
            <button type="button" class="btn btn-small demo-filter-btn active" data-filter="all">All</button>
            <button type="button" class="btn btn-small btn-outline demo-filter-btn" data-filter="members">Members</button>
            <button type="button" class="btn btn-small btn-outline demo-filter-btn" data-filter="businesses">Businesses</button>
            <button type="button" class="btn btn-small btn-outline demo-filter-btn" data-filter="churches">Churches</button>
          </div>
          <div id="demoRecordsSection">
            <p class="text-muted">Loading...</p>
          </div>
          <div class="mt-md">
            <button type="button" id="refreshDemoRecords" class="btn btn-outline btn-small">Refresh</button>
            <button type="button" id="deleteAllDemoRecords" class="btn btn-red btn-small hidden">Retire All Shown</button>
          </div>
        </div>

        <div class="text-center mt-lg">
          <a href="/admin/index.html" class="btn btn-outline">Back to Dashboard</a>
        </div>
      </div>
    </main>

    <div id="footer"></div>
  </div>

  <script src="/admin/js/header.js" type="module"></script>
  <script src="/admin/js/footer.js" defer></script>
  <script src="/admin/js/demo-invitations.js" type="module"></script>
  <script src="/js/breadcrumbs.js" defer></script>
  <script src="/js/feedback-widget.js" type="module"></script>
</body>
</html>
