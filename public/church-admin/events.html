<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <title>Manage Events - Kingdom Connects</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">

  <link rel="stylesheet" href="/styles/layout.css?v=7">
  <link rel="stylesheet" href="/styles/theme.css?v=7">
  <link rel="stylesheet" href="/styles/buttons.css?v=7">
  <link rel="stylesheet" href="/styles/forms.css?v=7">
  <link rel="stylesheet" href="/styles/overrides.css?v=7">
</head>

<body>
  <a id="top"></a>
  <div class="page-wrap">
    <div id="header"></div>
        <main class="page-content" id="main">
      <div id="breadcrumbs" class="breadcrumb-container"></div>

      <h1 class="gold-metallic text-center">Manage Events</h1>
      <p class="text-center text-muted mb-md">Create events for your public church page.</p>

      <div class="split-40-60">
        <div class="split-left">
          <button class="btn btn-gold mb-md" id="addEventBtn">+ Add Event</button>
        </div>

        <div class="split-right">
          <div id="eventsList">
            <p class="status-message">Loading events...</p>
          </div>
        </div>
      </div>
    </main>

    <div id="footer"></div>
  </div>

  <div id="eventModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Add Event</h2>
        <button class="close-btn" id="closeModal">&times;</button>
      </div>

      <form id="eventForm">
        <input type="hidden" id="eventId">

        <div class="form-group">
          <label for="title">Event Title *</label>
          <input type="text" id="title" class="input-dark" required placeholder="e.g., Easter Sunday Service">
        </div>

        <div class="form-group">
          <label for="description">Description *</label>
          <textarea id="description" class="input-dark" rows="4" required placeholder="Describe your event..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="eventDate">Date *</label>
            <input type="date" id="eventDate" class="input-dark" required>
          </div>
          <div class="form-group">
            <label for="eventTime">Time *</label>
            <input type="time" id="eventTime" class="input-dark" required>
          </div>
        </div>

        <div class="form-group">
          <label for="endTime">End Time (optional)</label>
          <input type="time" id="endTime" class="input-dark">
        </div>

        <div class="form-group">
          <label for="location">Location</label>
          <input type="text" id="location" class="input-dark" placeholder="e.g., Main Sanctuary, Fellowship Hall">
        </div>

        <div class="form-group">
          <label for="rsvpLink">RSVP Link (optional)</label>
          <input type="url" id="rsvpLink" class="input-dark" placeholder="https://...">
        </div>

        <div class="button-row">
          <button type="submit" class="btn btn-gold">Save Event</button>
          <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/header.js" defer></script>
  <script src="js/footer.js" defer></script>
  <script src="/js/breadcrumbs.js" defer></script>
  <script type="module" src="js/events.js"></script>
  <script src="/js/feedback-widget.js" type="module"></script>
</body>
</html>
