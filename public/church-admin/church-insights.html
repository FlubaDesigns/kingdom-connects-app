<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <title>Church Insights - Kingdom Connects</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">

  <link rel="stylesheet" href="/styles/layout.css?v=7">
  <link rel="stylesheet" href="/styles/theme.css?v=7">
  <link rel="stylesheet" href="/styles/buttons.css?v=7">
  <link rel="stylesheet" href="/styles/forms.css?v=7">
  <link rel="stylesheet" href="/styles/overrides.css?v=7">
</head>

<body>
  <a id="top"></a>
  <div class="page-wrap">
  <div id="header"></div>
    <main class="page-content" id="main">
      <div id="breadcrumbs" class="breadcrumb-container"></div>

      <h2 class="gold-metallic text-center">Church Insights</h2>
      <p class="text-center text-muted mb-md">Keep your church details up to date for better community connections.</p>
      
      <div id="lastUpdatedBadge" class="hidden completion-badge">
        <span id="lastUpdatedText"></span>
      </div>

      <div class="progress-text" id="progressText">Loading questions...</div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div id="loadingMessage" class="text-center p-md">Loading questions...</div>
      
      <form id="questionnaireForm" class="hidden">
        <article class="card">
          <h3 class="gold">Church Information</h3>
          <div id="questionsContainer"></div>
          
          <div class="btn-row mt-lg">
            <button type="button" id="saveDraftBtn" class="btn btn-secondary">Save Draft</button>
            <button type="submit" class="btn btn-gold">Update Church Insights</button>
          </div>
        </article>
      </form>
    </section>
  </main>

  <div id="footer"></div>
  </div>

  <script src="js/header.js" defer></script>
  <script src="js/footer.js" defer></script>
  <script src="/js/breadcrumbs.js" defer></script>
  <script type="module" src="js/church-insights.js"></script>
  <script src="/js/feedback-widget.js" type="module"></script>
</body>
</html>
