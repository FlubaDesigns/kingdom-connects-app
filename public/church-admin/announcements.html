<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <title>Manage Announcements - Kingdom Connects</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">

  <link rel="stylesheet" href="/styles/layout.css?v=7">
  <link rel="stylesheet" href="/styles/theme.css?v=7">
  <link rel="stylesheet" href="/styles/buttons.css?v=7">
  <link rel="stylesheet" href="/styles/forms.css?v=7">
  <link rel="stylesheet" href="/styles/overrides.css?v=7">
</head>

<body>
  <a id="top"></a>
  <div class="page-wrap">
    <div id="header"></div>
        <main class="page-content" id="main">
      <div id="breadcrumbs" class="breadcrumb-container"></div>

      <h1 class="gold-metallic text-center">Manage Announcements</h1>
      <p class="text-center text-muted mb-md">Share updates with your congregation on your public page.</p>

      <div class="split-40-60">
        <div class="split-left">
          <button class="btn btn-gold mb-md" id="addAnnouncementBtn">+ Add Announcement</button>
        </div>

        <div class="split-right">
          <div id="announcementsList">
            <p class="status-message">Loading announcements...</p>
          </div>
        </div>
      </div>
    </main>

    <div id="footer"></div>
  </div>

  <div id="announcementModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Add Announcement</h2>
        <button class="close-btn" id="closeModal">&times;</button>
      </div>

      <form id="announcementForm">
        <input type="hidden" id="announcementId">

        <div class="form-group">
          <label for="title">Title *</label>
          <input type="text" id="title" class="input-dark" required placeholder="e.g., Service Time Change">
        </div>

        <div class="form-group">
          <label for="body">Message *</label>
          <textarea id="body" class="input-dark" rows="4" required placeholder="Write your announcement..."></textarea>
          <span class="char-count"><span id="bodyCount">0</span>/500</span>
        </div>

        <div class="form-group">
          <label for="priority">Priority</label>
          <select id="priority" class="input-dark">
            <option value="1">Normal</option>
            <option value="2">Important</option>
            <option value="3">Urgent</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="publishStart">Start Date</label>
            <input type="date" id="publishStart" class="input-dark">
          </div>
          <div class="form-group">
            <label for="publishEnd">End Date (optional)</label>
            <input type="date" id="publishEnd" class="input-dark">
          </div>
        </div>

        <div class="form-group">
          <label>
            <input type="checkbox" id="isDraft">
            Save as draft (don't publish yet)
          </label>
        </div>

        <div class="button-row">
          <button type="submit" class="btn btn-gold">Save Announcement</button>
          <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/header.js" defer></script>
  <script src="js/footer.js" defer></script>
  <script src="/js/breadcrumbs.js" defer></script>
  <script type="module" src="js/announcements.js"></script>
  <script src="/js/feedback-widget.js" type="module"></script>
</body>
</html>
