<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Under Construction - Kingdom Connects</title>
  <meta name="robots" content="noindex, nofollow">
  
  <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/buttons.css">
</head>
<body>
  <a id="top"></a>
  <div class="page-wrap">
    <div id="header"></div>

    <main class="page-content" id="main">
      <div id="breadcrumbs" class="breadcrumb-container"></div>
        <article class="card text-center">
          <div class="logo-container mb-lg">
            <img src="library/kingdom-connects-logo-300.png" alt="Kingdom Connects" class="site-logo-large">
          </div>
          
          <h1 class="gold-metallic mb-md">Under Construction</h1>
          
          <p class="text-lg mb-md">
            Kingdom Connects is currently undergoing maintenance and updates.
          </p>
          
          <p class="mb-lg">
            We're working hard to improve your experience. Please check back soon!
          </p>
          
          <div class="info-card mb-lg">
            <p><strong>Need to get in touch?</strong></p>
            <p class="mt-sm">Email us at: <a href="mailto:info@kingdomconnects.org" class="gold">info@kingdomconnects.org</a></p>
          </div>
          
          <p class="text-sm text-muted">Thank you for your patience and understanding.</p>
        </article>
    </main>
  
    <div id="footer"></div>
  </div>
  <script src="/js/breadcrumbs.js" defer></script>
</body>
</html>
